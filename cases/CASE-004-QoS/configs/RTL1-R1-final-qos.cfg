! CASE-004 final QoS on RTL1-R1 (Store 1), as entered 2026-11-17 11:42-11:44 CST.
! Rebuilt from TACACS command accounting. Applied on top of golden 2026-11-16-qos.
! Result: checkouts 20/20 approved, median 50 ms under the 40 s end-of-day load.
!
! ---------- 1. CLASSIFY: which packets are which (ACL -> class-map) ----------
ip access-list extended PCI-SOURCE
 10 remark PCI input for QoS
 10 permit tcp host 192.168.100.10 any eq 19090
ip access-list extended PCI-NIGHTLY
 10 remark EOD batch sync
 10 permit tcp host 192.168.100.10 any eq 9000
!
class-map match-all PCI-IN
 description PCI inbound priority
 match access-group name PCI-SOURCE
class-map match-all PCI-LIMIT
 ! name is misleading: this class only MARKS the batch, it does not limit it (PCI-BATCH would be clearer)
 description Limit the upload bandwidth
 match access-group name PCI-NIGHTLY
!
! ---------- 2. MARK at the door: store LAN, inbound ----------
policy-map PCI-IN
 description Classify with DSCP tags the PCI traffic over port 19090
 class PCI-IN
  set dscp af21
 class PCI-LIMIT
  set dscp af11
!
interface Ethernet0/1.100
 service-policy input PCI-IN
!
! ---------- 3. QUEUE on the way out: match the marks (ports are hidden inside ESP here) ----------
class-map match-all WAN-PAYMENT
 match dscp af21
class-map match-all WAN-ROUTING
 match dscp cs6
class-map match-all WAN-BATCH
 match dscp af11
!
policy-map WAN-CHILD
 class WAN-PAYMENT
  priority 16
 class WAN-ROUTING
  bandwidth 8
 class WAN-BATCH
  bandwidth 16
 class class-default
  fair-queue
!
! ---------- 4. SHAPE under the 64 kbps circuit so the queue lives HERE, not at the ISP ----------
policy-map WAN-PARENT
 class class-default
  shape average 56000
  service-policy WAN-CHILD
!
interface Ethernet0/0
 service-policy output WAN-PARENT
!
end
write memory
